# Follows upstream (OpenActionAPI/rust-elgato-streamdeck).
# - `main` is an exact copy of upstream `main`: fast-forwarded here, never committed to by hand.
# - `curioustimo` (the default branch) holds our changes. When upstream has commits that
#   `curioustimo` does not, this opens one pull request main -> curioustimo, with a build check of
#   the merged result in its description, and keeps it up to date.
name: Follow upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  follow:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curioustimo
          fetch-depth: 0

      - name: Fast-forward main to upstream
        run: |
          git remote add upstream https://github.com/OpenActionAPI/rust-elgato-streamdeck
          git fetch upstream main
          git fetch origin main
          # No --force: if main ever got a commit of its own, this fails instead of losing it.
          git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Count new upstream commits
        id: count
        run: echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Build check of the merge
        id: build
        if: steps.count.outputs.behind != '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libudev-dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            echo "result=merge conflict" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if cargo build --all-features && cargo test --all-features; then
            echo "result=build and tests pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=build or tests FAIL (see the run)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.count.outputs.behind != '0'
        run: |
          body="Upstream has ${{ steps.count.outputs.behind }} commit(s) that \`curioustimo\` does not.

          Merged result: **${{ steps.build.outputs.result }}** ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          Check what changed on the wire before merging, and update the pinned \`rev\` in the projects that use this fork."
          pr=$(gh pr list --base curioustimo --head main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base curioustimo --head main --title "Upstream: new commits" --body "$body"
          else
            gh pr edit "$pr" --body "$body"
          fi
